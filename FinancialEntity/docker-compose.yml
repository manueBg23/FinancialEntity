services:
  db:
    image: mysql:8.0
    container_name: mysql_financial_db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: financial_entity_db
    ports:
      - "3307:3306"
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build: .
    container_name: financial_app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always